name: Public contract drift

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1-5'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Compare canonical OpenAPI semantically
        run: go run ./internal/cmd/contract-drift https://docs.viapost.io/openapi/public.yaml openapi.yaml
