name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Download modules
        run: go mod download
      - name: Verify generated client, auth surface, tests, vet, and vulnerabilities
        run: make verify
      - name: Verify semantic version against public API changes
        run: make api-diff
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check repository diff
        run: git diff --check && test -z "$(git status --porcelain)"
